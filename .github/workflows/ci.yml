name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkup
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: linkup_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linkup -d linkup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://linkup:ci_local_only@localhost:5432/linkup_test
      NODE_ENV: test
      RUN_DATABASE_TESTS: 'true'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run check
      - name: Check database readiness
        shell: bash
        run: |
          npm start > /tmp/linkup-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:4000/api/v1/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/linkup-api.log
          exit 1
      - name: Build and verify Docker deployment
        shell: bash
        run: |
          cp deploy/.env.example deploy/.env
          POSTGRES_PASSWORD=ci-compose-only docker compose --env-file deploy/.env -f compose.deploy.yml config --quiet
          docker build --target runtime -f backend/Dockerfile -t linkup:ci .
          docker build --target migrations -f backend/Dockerfile -t linkup:migrations-ci .
          docker run --rm --network host -e DATABASE_URL linkup:migrations-ci
          docker run -d --name linkup-smoke --network host \
            -e DATABASE_URL -e PORT=4100 \
            -e JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e CLIENT_URL=http://localhost:4100 \
            -e PUBLIC_WEB_URL=http://localhost:4100 linkup:ci
          trap 'docker rm -f linkup-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:4100/api/v1/health/ready; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4100/api/v1/health/ready
          curl --fail --silent http://localhost:4100/login | grep -q 'id="root"'
          curl --fail --silent http://localhost:4100/api/docs/ | grep -q 'swagger-ui'
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          const response = await fetch('http://localhost:4100/api/v1/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Linkup-Request': '1' }, body: JSON.stringify({ name: 'Docker smoke', email: `docker-${randomUUID()}@example.test`, password: 'DockerSmoke!42' }) });
          if (response.status !== 201) throw new Error(`Docker registration failed (${response.status}).`);
          console.log('Docker frontend, docs, migrations, database and account creation passed.');
          NODE

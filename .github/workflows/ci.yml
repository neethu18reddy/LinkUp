name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkup
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: linkup_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linkup -d linkup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://linkup:ci_local_only@localhost:5432/linkup_test
      NODE_ENV: test
      RUN_DATABASE_TESTS: 'true'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run check
      - name: Check database readiness
        shell: bash
        run: |
          npm start > /tmp/linkup-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:4000/api/v1/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/linkup-api.log
          exit 1

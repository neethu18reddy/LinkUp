name: linkup-production
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkup
      POSTGRES_DB: linkup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure deploy/.env first}
    volumes:
      - production_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linkup -d linkup']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrations
    env_file: ./deploy/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file: ./deploy/.env
    environment:
      NODE_ENV: production
      SERVE_WEB: 'true'
      PORT: 4000
    ports:
      - '127.0.0.1:4000:4000'
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  production_postgres:

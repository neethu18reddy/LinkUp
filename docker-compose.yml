name: linkup

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting PostgreSQL}
      POSTGRES_DB: ${POSTGRES_DB:-linkup}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - linkup_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ['app']
    env_file:
      - ./backend/.env
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      SERVE_WEB: 'false'
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-linkup}
      CLIENT_URL: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  linkup_postgres:
